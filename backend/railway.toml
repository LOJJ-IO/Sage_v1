# Config-as-code for the Sage backend service.
# Railway dashboard: Root Directory = backend, Config path = /backend/railway.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects PORT at runtime — do NOT set a manual PORT=8000 variable.
# Must use /bin/sh -c: Railway runs startCommand in exec form (no env expansion).
preDeployCommand = "/bin/sh -c 'alembic upgrade head'"
startCommand = "/bin/sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
