services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sage-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: sage_dev
      POSTGRES_PASSWORD: sage_dev
      POSTGRES_DB: sage_test
    ports:
      - "55432:5432"
    volumes:
      - sage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage_dev -d sage_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sage_pgdata:
