[project]
name = "sage-backend"
version = "0.1.0"
description = "Sage multi-tenant document-grounded QA backend (FastAPI, Postgres/pgvector, Pydantic AI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    "python-magic>=0.4.27; platform_system != 'Windows'",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "openai>=1.54",
    "docling>=2.5",
    "flashrank>=0.2.9",
    "pydantic-ai-slim[google]>=0.0.14",
    "logfire[fastapi]>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]
